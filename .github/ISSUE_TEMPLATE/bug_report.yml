name: Bug report
description: Report a reproducible problem with deck_neo
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, usernames, private paths, session contents, and sensitive log data before submitting.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What went wrong?
      placeholder: Describe the visible behavior and when it occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest repeatable sequence that triggers the problem.
      placeholder: |
        1. Start the daemon with ...
        2. Start a session with ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.6"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Run `node --version`.
      placeholder: "v22.18.0"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Stream Deck model
      options:
        - Stream Deck Neo
        - Other model (currently unsupported)
    validations:
      required: true
  - type: dropdown
    id: elgato_app
    attributes:
      label: Elgato Stream Deck app state
      options:
        - Quit before the deck_neo daemon started
        - Running before the deck_neo daemon started
        - Not installed
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Agent integration
      options:
        - Claude Code
        - Codex CLI
        - ChatGPT app thread
        - Synthetic demo
        - Not agent-specific
    validations:
      required: true
  - type: dropdown
    id: launch_method
    attributes:
      label: Session launch method
      options:
        - cc
        - cx
        - cxa
        - Plain Claude Code or Codex CLI
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the minimum redacted lines needed to explain the failure.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, usernames, private paths, session contents, and sensitive log data.
          required: true
